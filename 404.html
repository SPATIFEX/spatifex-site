<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — page not found — Spatifex</title>
<meta name="description" content="This page does not exist on spatifex.com.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<link rel="canonical" href="https://spatifex.com/404.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<!--
  The styles below are inlined rather than pulled from styles.css on purpose.
  GitHub Pages serves this one file for every missing path at every depth, so a
  relative stylesheet link would resolve differently for /nope than for
  /ru/nope/deeper, and a root-absolute one would break under a project-pages
  preview URL. Inlining removes the question: this page is correct from any
  depth and needs no stylesheet request. Its only subresource is the favicon
  above, which a browser fetches on its own whether a page declares one or not.

  All four references on this page - the two icons above and the two navigation
  links below - are root-absolute, because they are correct on the custom
  domain, which is where a 404 matters. Under a sub-path preview URL they point
  at the wrong place; that is documented in DEPLOYMENT.md and accepted.
-->
<style>
  :root { color-scheme: dark; }
  * , *::before, *::after { box-sizing: border-box; }
  html { background: #0b0c0f; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: #0b0c0f;
    color: #f5f7fa;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    line-height: 1.6;
  }
  .shell { width: min(100% - 2rem, 46rem); margin-inline: auto; padding: 3rem 0; }
  h1, p, li, a { overflow-wrap: break-word; }
  .code {
    margin: 0 0 0.9rem;
    color: #7ef0c3;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  h1 {
    max-width: 22ch;
    margin: 0 0 1.1rem;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  p { max-width: 54ch; margin: 0 0 0.7rem; color: #aeb4be; }
  ul { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.6rem 0 0; padding: 0; list-style: none; }
  ul a {
    display: inline-block;
    padding: 0.55rem 0.95rem;
    border: 1px solid #2a2f39;
    border-radius: 999px;
    background: #111319;
    color: #f5f7fa;
    text-decoration: none;
  }
  ul a:hover { border-color: #7ef0c3; }
  a:focus { outline: 3px solid #7ef0c3; outline-offset: 3px; border-radius: 3px; }
  a:focus:not(:focus-visible) { outline: none; }
  a:focus-visible { outline: 3px solid #7ef0c3; outline-offset: 3px; border-radius: 3px; }
</style>
</head>
<body>
<main class="shell">
  <p class="code">Error 404</p>
  <h1>Page not found</h1>
  <p>This page does not exist on spatifex.com.</p>
  <p lang="ru">Такой страницы на spatifex.com нет.</p>
  <ul>
    <li><a href="/" lang="en" hreflang="en">Spatifex home</a></li>
    <li><a href="/ru/" lang="ru" hreflang="ru">Главная страница</a></li>
  </ul>
</main>
</body>
</html>
